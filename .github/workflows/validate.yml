name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate skill frontmatter and structure
        run: npm run validate

      - name: Regenerate index.json and marketplace.json
        run: npm run build-index

      - name: Fail if generated files are stale
        run: git diff --exit-code index.json .claude-plugin/
